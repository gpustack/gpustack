# Declarative, read-only cache-provider catalog. Loaded by
# gpustack/server/cache_provider_catalog.py and served via
# GET /v2/cache-providers. Providers are shipped with GPUStack releases
# and are not user-editable resources.
#
# Template placeholders available in run_command / run_args / env /
# injection:
#   {{host}}         bind or connect address
#   {{port}}         cache server port
#   {{metrics_port}} Prometheus metrics port (managed mode)
#   {{ram_size}}     cache capacity in GiB (service config)
#   {{chunk_size}}   tokens per KV chunk (service or deployment config)
# A provider's `managed_fields` add {{<name>}} placeholders carrying
# UI-configured values (falling back to declared defaults); a flag whose
# placeholder renders empty is dropped together with the flag.
# Env entries whose rendered value is empty are dropped.
# A version launches its image one of two ways. run_command is the whole
# argument vector and takes the image's ENTRYPOINT slot, so it names the
# executable too — for images whose entrypoint is something else (e.g. an
# engine server). run_args keeps the image's own entrypoint and is
# appended to it as arguments — for images that start the cache server
# themselves, including ones doing setup around it. The two are
# alternatives; the L2 adapter flags and user parameters join whichever
# vector is declared, or stand alone when neither is.
#
# A version entry inherits default_run_command / default_run_args /
# default_image / default_runtime_images from its provider, so a release
# line with a uniform tag layout declares each version as a bare key.
# The launch pair and the image layout are each inherited as a unit: a
# version declaring one field of a pair owns that pair. {{version}} in
# the image templates renders the version key — optional, for providers
# whose tags embed it. The defaults are folded into every version at
# load, so consumers read one effective image and launch off the version
# config.
- name: LMCache
  display_name: LMCache
  source: built_in
  icon: /static/catalog_icons/lmcache.png
  description:
    default: >-
      LMCache is a KV cache layer for LLM serving. As a shared cache service it
      runs a cache server on every worker; deployments and replicas on the same
      node share KV cache through it, and a shared L2 storage backend extends
      the reuse across nodes.
    zh-CN: >-
      LMCache 是面向大模型推理的 KV Cache 层。作为共享缓存服务，它在每个 worker
      上运行一个缓存服务端，同节点的部署与副本通过它共享 KV Cache，共享的 L2
      存储后端把复用范围扩展到跨节点。
  links:
    - label: { default: Documentation, zh-CN: 文档 }
      url: "https://docs.lmcache.ai"
    # A brand name reads the same in every locale, so it stays bare.
    - { label: GitHub, url: "https://github.com/LMCache/LMCache" }
  # Managed only: LMCache is the out-of-box single-container engine
  # GPUStack runs itself. Its distributed form (operator + coordinator +
  # per-node servers) is a self-deployed fleet that overlaps this managed
  # per_node topology; genuinely reference-only distributed caches (e.g.
  # Mooncake) are what external mode is for.
  supported_modes: [managed]
  # The MP server keeps KV transfers node-local: every worker runs its
  # own cache server instance and engines attach to the one on their
  # node, so managed deployments follow the cluster's workers.
  topology: per_node
  # The MP connector's zero-copy path is CUDA IPC: engines can only
  # attach the cache server on their own node.
  attach_locality: node_local
  default_version: "v0.5.4"
  # A service may pin a user-supplied image ("custom" version); it runs
  # with the default version's run command and env templates, so the image
  # must be command-compatible.
  custom_version: true
  default_run_command: "lmcache server --host {{host}} --port {{port}} --l1-size-gb {{ram_size}} --chunk-size {{chunk_size}} --http-host {{host}} --http-port {{metrics_port}} --supported-transfer-mode auto --worker-reap-timeout-seconds 60 --eviction-policy {{eviction_policy}} --eviction-trigger-watermark {{eviction_trigger_watermark}} --eviction-ratio {{eviction_ratio}}"
  default_image: "lmcache/vllm-openai:{{version}}"
  default_runtime_images:
    cuda:
      "13": "lmcache/vllm-openai:{{version}}"
      "12": "lmcache/vllm-openai:{{version}}-cu129"
  # Declared versions, each built from the layout above. A version off
  # that tag scheme declares image / runtime_images itself instead.
  versions:
    "v0.5.4": {}
    "v0.5.3": {}
    "v0.5.2": {}
  resource_profile:
    ram_gib: "{{ram_size}}"
    cpu: 2
    # The server attaches to the node's GPUs to open CUDA IPC handles into
    # the engines' KV buffers; budget ~0.5-1 GiB VRAM per GPU for its CUDA
    # context (not modeled by the scheduler — leave that headroom free).
  # L2 storage: the MP server takes one flag whose value is a JSON object
  # of the form {"type": <backend key>, ...backend-specific fields}.
  # Fields with env_name are read by the server from that env var when
  # absent from the JSON, keeping credentials off the command line.
  # Eviction knobs promoted to structured advanced fields, wired into
  # the run command via their {{name}} placeholders; values and defaults
  # follow the v0.5.2 storage-manager argument group. The eviction
  # policy is required upstream, so its default always renders.
  managed_fields:
    - name: eviction_policy
      label: { default: Eviction Policy, zh-CN: 淘汰策略 }
      default: LRU
      # Engine enum values: they reach the command line verbatim and stay
      # untranslated, so what each one means lives in the description.
      options: [LRU, IsolatedLRU, noop]
      description:
        default: >-
          LRU evicts least-recently-used chunks. IsolatedLRU keeps one LRU
          list per cache salt and requires per-salt quotas via the HTTP
          API. noop never evicts.
        zh-CN: >-
          LRU 淘汰最近最少使用的分块。IsolatedLRU 为每个 cache salt 维护独立的 LRU
          列表，并需通过 HTTP API 为每个 salt 设置配额。noop 从不淘汰。
    - name: eviction_trigger_watermark
      label: { default: Eviction Trigger Watermark, zh-CN: 淘汰触发水位 }
      type: number
      default: 0.85
      min: 0
      max: 1
      step: 0.05
      description:
        default: Memory usage fraction (0-1) that triggers eviction.
        zh-CN: 触发淘汰的内存使用率（0-1）。
    - name: eviction_ratio
      label: { default: Eviction Ratio, zh-CN: 淘汰比例 }
      type: number
      default: 0.1
      min: 0
      max: 1
      step: 0.05
      description:
        default: Fraction of memory (0-1) evicted per trigger.
        zh-CN: 每次触发所淘汰的内存比例（0-1）。
  l2_adapter_flag: "--l2-adapter"
  l2_backends:
    fs_native:
      display_name: { default: Local Filesystem, zh-CN: 本地文件系统 }
      description:
        default: >-
          Spills KV cache to a local directory (e.g. NVMe) on the worker.
          max_capacity_gb caps disk usage; 0 or unset means uncapped.
        zh-CN: >-
          将 KV Cache 溢出到 worker 上的本地目录（如 NVMe）。max_capacity_gb
          限制磁盘用量；填 0 或留空表示不限制。
      fields:
        # Defaults into the platform data dir: on containerized workers
        # the mirrored deployment carries the worker's /var/lib/gpustack
        # host mount into the cache container, so spilled cache lands on
        # host disk and survives container recreation.
        - name: base_path
          label: { default: Base Path, zh-CN: 基础路径 }
          required: true
          default: /var/lib/gpustack/cache/lmcache/l2
        - name: max_capacity_gb
          label: { default: Max Capacity (GiB), zh-CN: 最大容量（GiB） }
          type: number
        - name: num_workers
          label: { default: I/O Workers, zh-CN: I/O 工作线程 }
          type: number
        - name: use_odirect
          label: { default: Direct I/O (O_DIRECT), zh-CN: 直接 I/O（O_DIRECT） }
          type: boolean
    resp:
      # A brand name reads the same in every locale, so it stays bare.
      display_name: Redis / Valkey
      icon: /static/catalog_icons/redis.svg
      description:
        default: Shared L2 in a Redis or Valkey server; cache survives cache-server restarts.
        zh-CN: 以 Redis 或 Valkey 服务端作为共享 L2；缓存服务端重启后缓存仍然保留。
      fields:
        - { name: host, label: { default: Host, zh-CN: 主机 }, required: true }
        - name: port
          label: { default: Port, zh-CN: 端口 }
          type: number
          required: true
        - name: username
          label: { default: Username, zh-CN: 用户名 }
          env_name: LMCACHE_RESP_USERNAME
        - name: password
          label: { default: Password, zh-CN: 密码 }
          type: password
          env_name: LMCACHE_RESP_PASSWORD
        - name: max_capacity_gb
          label: { default: Max Capacity (GiB), zh-CN: 最大容量（GiB） }
          type: number
    s3:
      display_name: S3
      icon: /static/catalog_icons/s3.svg
      description:
        default: >-
          Shared L2 in an S3-compatible object store (AWS S3, MinIO, Ceph
          RGW). The endpoint uses virtual-hosted style — the bucket name is
          part of the host, e.g. "kvcache.s3.example.com"; path-style
          addressing is not supported. max_capacity_gb caps aggregate
          usage; 0 or unset means uncapped.
        zh-CN: >-
          以兼容 S3 的对象存储作为共享 L2（AWS S3、MinIO、Ceph RGW）。地址采用
          virtual-hosted 风格——bucket 名是主机名的一部分，例如
          "kvcache.s3.example.com"；不支持 path-style 寻址。max_capacity_gb
          限制总用量；填 0 或留空表示不限制。
      fields:
        - name: s3_endpoint
          label: { default: Bucket Endpoint, zh-CN: Bucket 地址 }
          required: true
        - name: s3_region
          label: { default: Region, zh-CN: 区域 }
          required: true
        # Access Key ID and Secret Access Key are the object store's own
        # credential names; they stay bare, as every S3 console shows them.
        - { name: aws_access_key_id, label: Access Key ID, env_name: AWS_ACCESS_KEY_ID }
        - name: aws_secret_access_key
          label: Secret Access Key
          type: password
          env_name: AWS_SECRET_ACCESS_KEY
        - name: disable_tls
          label: { default: Disable TLS (HTTP Endpoint), zh-CN: 禁用 TLS（HTTP 端点） }
          type: boolean
        - name: max_capacity_gb
          label: { default: Max Capacity (GiB), zh-CN: 最大容量（GiB） }
          type: number
  # Completion hints for the extra-parameters editor. Deliberately
  # excludes the flags GPUStack always renders from structured config.
  common_parameters:
    - --l2-adapter
    # CLI-entry-only groups (coordinator / P2P), valid again now that the
    # run command uses `lmcache server` instead of the module entry.
    - --coordinator-url
    - --p2p-advertise-url
    - --max-workers
    - --max-gpu-workers
    - --max-cpu-workers
    - --hash-algorithm
    - --enable-segmented-prefix
    - --shm-name
    - --worker-reap-timeout-seconds
    - --worker-registration-grace-seconds
    - --l1-use-lazy
    - --l1-init-size-gb
    - --l1-align-bytes
    - --l1-read-ttl-seconds
    - --l1-write-ttl-seconds
    - --gds-l1-path
    - --gds-l1-use-direct-io
    - --l1-devdax-path
    - --l2-store-policy
    - --l2-prefetch-policy
    - --l2-prefetch-max-in-flight
    - --metrics-sample-rate
    - --disable-metrics
    - --disable-logging
    - --disable-observability
    - --enable-tracing
    - --otlp-endpoint
    - --event-bus-queue-size
    - --trace-level
    - --trace-output
  # /healthcheck verifies the engine is initialized (503 until then) —
  # a stronger signal than a TCP connect on the ZMQ port. It lives on
  # the HTTP frontend, which is the metrics port in our port model.
  health_check:
    scheme: http
    path: /healthcheck
    target: metrics
  # Metric names follow the LMCache MP observability docs
  # (https://docs.lmcache.ai/mp/observability.html). The mappings feed
  # the cache-service metrics endpoint backing the UI charts.
  # This block is the all-version default; a version that renames
  # metrics (the _GB_per_second suffix is an OTel exporter artifact and
  # a likely candidate) declares its own metrics block, which overrides
  # this one whole for services pinned to it.
  default_metrics:
    path: /metrics
    mappings:
      hit_rate:
        ratio:
          numerator: lmcache_mp_lookup_hit_tokens_total
          denominator: lmcache_mp_lookup_requested_tokens_total
      l1_usage_bytes:
        gauge: lmcache_mp_l1_memory_usage_bytes
      l1_usage_ratio:
        gauge: lmcache_mp_l1_usage_ratio
        aggregate: avg
      # One series per configured L2 adapter (l2_name label). Bytes
      # only: upstream exposes no L2 capacity gauge, so no ratio form.
      l2_usage_bytes:
        gauge: lmcache_mp_l2_usage_bytes
      # Lookup traffic gives the hit-rate chart its denominator context:
      # an empty hit-rate window reads as no traffic, not as a fault.
      lookup_tokens_per_second:
        rate: lmcache_mp_lookup_requested_tokens_total
    throughput:
      l0_l1_store: { histogram_avg: lmcache_mp_l0_l1_store_throughput_GB_per_second }
      l0_l1_load: { histogram_avg: lmcache_mp_l0_l1_load_throughput_GB_per_second }
      l2_store: { histogram_avg: lmcache_mp_l2_store_throughput_GB_per_second }
      l2_load: { histogram_avg: lmcache_mp_l2_load_throughput_GB_per_second }
  inference_backend_integrations:
    # The MP server speaks ZMQ: clients attach through the MP connector
    # pointed at tcp://host:port (the server's --port), and the connector
    # requires the non-hybrid KV cache manager. Engines attach node-local
    # only (the per_node resolver degrades instead of crossing nodes:
    # the engine-driven copy path measures slower than no cache at all),
    # so the placement fact always renders {{mp_transfer_mode}} "auto" —
    # the CUDA-IPC zero-copy path, both containers sharing the host IPC
    # namespace, with host-copy fallback on CPU-only workers.
    # Scoped to the accelerators the connector is validated on — the
    # catalog is the single accelerator gate: on other frameworks the
    # resolver finds no integration and the instance starts degraded
    # with an explicit reason (no half-injection on the worker).
    - backend: vLLM
      frameworks: [cuda]
      # Floor set by the newer of the two requirements: the MP connector
      # integration line validated in-house (v0.25.x) and the injected
      # --shutdown-timeout flag (vllm-project/vllm#36666, first released
      # in v0.25.0).
      versions: ">=0.25.0"
      injection:
        env:
          # The MP token hasher falls back to Python's builtin hash when
          # vLLM's hash function cannot be loaded; without a pinned seed
          # every engine process hashes chunks differently and
          # cross-instance sharing silently never hits.
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: auto }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          - "--disable-hybrid-kv-cache-manager"
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    # SGLang attaches through --enable-lmcache with a YAML config file
    # carrying the MP server address (the adapter pulls the chunk size
    # from the server itself). Its MP connector shares KV via CUDA IPC
    # with no cross-node fallback, so a SGLang deployment needs a cache
    # instance on its own worker — the per_node topology provides one
    # unless the worker selector excludes that node.
    - backend: SGLang
      frameworks: [cuda]
      # LMCache MP support landed in sglang PR #24089 (merged 2026-05-28);
      # v0.5.13 is the first release carrying it.
      versions: ">=0.5.13"
      injection:
        env:
          # Same builtin-hash fallback guard as the vLLM side.
          PYTHONHASHSEED: "0"
        args:
          - "--enable-lmcache"
          - "--lmcache-config-file"
          - "/tmp/gpustack-lmcache-sgl.yaml"
        files:
          /tmp/gpustack-lmcache-sgl.yaml: |
            mp_host: "{{host}}"
            mp_port: {{port}}
- name: Mooncake
  display_name: Mooncake
  source: built_in
  icon: /static/catalog_icons/mooncake.png
  description:
    default: >-
      Mooncake Store is a distributed KV cache pool with a cluster-wide master
      and per-node clients that transfer KV blocks peer-to-peer over RDMA/TCP.
      It is deployed and operated outside GPUStack; register the master address
      and GPUStack attaches inference engines to it, probes it, and (once
      calibrated) scrapes its metrics.
    zh-CN: >-
      Mooncake Store 是一个分布式 KV Cache 池，由集群级 master 和各节点客户端组成，节点间通过
      RDMA/TCP 点对点传输 KV 块。它在 GPUStack 之外部署和运维；注册 master
      地址后，GPUStack 负责把推理引擎接入、探活，并在完成校准后采集其指标。
  links:
    - label: { default: Documentation, zh-CN: 文档 }
      url: "https://kvcache-ai.github.io/Mooncake/"
    - { label: GitHub, url: "https://github.com/kvcache-ai/Mooncake" }
  # Provider-specific Grafana dashboard provisioned from
  # docker-compose/grafana/grafana_dashboards/gpustack-mooncake.json,
  # built on the master's pool/keys/eviction/request metrics.
  dashboard_uid: gpustack-mooncake
  supported_modes: [external]
  # External connection parameters. The master address is the endpoint
  # (host+port, default RPC port 50051); these feed the rest of the
  # connector config. metadata_server P2PHANDSHAKE keeps peer discovery
  # decentralized (no separate etcd/redis); a cluster with an external
  # metadata service registers its "etcd://" / "http://" address instead.
  external_fields:
    - name: metadata_server
      label: { default: Metadata Server, zh-CN: 元数据服务 }
      description:
        default: >-
          Transfer Engine peer-discovery backend: P2PHANDSHAKE (decentralized),
          or an etcd:// / redis:// / http:// address.
        zh-CN: >-
          Transfer Engine 的节点发现后端：P2PHANDSHAKE（去中心化），或一个
          etcd:// / redis:// / http:// 地址。
      default: P2PHANDSHAKE
    - name: protocol
      label: { default: Transport Protocol, zh-CN: 传输协议 }
      description:
        default: RDMA for production performance; TCP for functional setups.
        zh-CN: 生产环境用 RDMA 以获得性能；功能验证用 TCP。
      default: tcp
      options: [tcp, rdma]
    - name: device_name
      label: { default: RDMA Device, zh-CN: RDMA 设备 }
      description:
        default: NIC device(s) for the RDMA protocol; leave empty for TCP.
        zh-CN: RDMA 协议使用的网卡设备；使用 TCP 时留空。
    - name: local_buffer_size
      label: { default: Local Buffer Size, zh-CN: 本地缓冲区大小 }
      description:
        default: >-
          Per-GPU staging buffer for the engine's own store operations
          (e.g. 1GB).
        zh-CN: 引擎自身 store 操作所用的每 GPU 暂存缓冲区（如 1GB）。
      default: 1GB
  health_check:
    scheme: tcp
  # The master serves Prometheus text on its metrics port (GET /metrics,
  # enable_metric_reporting defaults to true). Metric names follow
  # mooncake-store's master_metric_manager. Lookup-hit accounting lives
  # in the engine-side connector, not the master, so there is no
  # hit_rate mapping; usage is the pool's allocated-vs-capacity view.
  default_metrics:
    path: /metrics
    default_port: 9003
    mappings:
      l1_usage_bytes:
        gauge: master_allocated_bytes
      l1_usage_ratio:
        gauge_ratio:
          numerator: master_allocated_bytes
          denominator: master_total_capacity_bytes
  inference_backend_integrations:
    # MooncakeStoreConnector uses the Mooncake distributed store as a
    # shared KV pool. The connector reads its configuration solely from
    # the JSON file MOONCAKE_CONFIG_PATH points at (no per-field env
    # support), so the injection writes that file into the engine
    # container. mode standalone-store with global_segment_size 0 makes
    # the engine a pure requester: the externally deployed cluster owns
    # the pool. The mode field is recent in vLLM; behavior on older
    # connectors is a calibration surface for integration testing.
    - backend: vLLM
      frameworks: [cuda]
      versions: ">=0.9.0"
      injection:
        env:
          MOONCAKE_CONFIG_PATH: /tmp/gpustack-mooncake.json
          # The TCP transport opens a fresh connection per transfer slice
          # by default; under prefill bursts the client-side TIME_WAIT
          # backlog exhausts ephemeral ports (connect() fails with
          # EADDRNOTAVAIL). Pooling is the sane default for LLM traffic;
          # the RDMA path never reads this switch.
          MC_TCP_ENABLE_CONNECTION_POOL: "1"
        files:
          /tmp/gpustack-mooncake.json: |
            {
              "mode": "standalone-store",
              "metadata_server": "{{metadata_server}}",
              "master_server_address": "{{master_server_address}}",
              "global_segment_size": 0,
              "local_buffer_size": "{{local_buffer_size}}",
              "protocol": "{{protocol}}",
              "device_name": "{{device_name}}"
            }
        kv_transfer_config:
          kv_connector: MooncakeStoreConnector
          kv_role: kv_both
# PLACEHOLDER. Change as needed.
- name: XSKY MeshFusion
  display_name: XSKY MeshFusion
  source: partner
  icon: /static/catalog_icons/xsky.png
  description:
    default: >-
      XSKY MeshFusion is a KV cache layer for LLM serving. As a shared cache
      service it runs a cache server on every worker; deployments and replicas
      on the same node share KV cache through it, and a shared L2 storage
      backend (e.g. XSKY's store) extends the reuse across nodes.
    zh-CN: >-
      XSKY MeshFusion 是面向大模型推理的 KV Cache 层。作为共享缓存服务，它在每个 worker
      上运行一个缓存服务端，同节点的部署与副本通过它共享 KV Cache，共享的 L2
      存储后端（如 XSKY 的存储）把复用范围扩展到跨节点。
  links:
    - label: { default: Product Page, zh-CN: 产品主页 }
      url: "https://www.xsky.com"
  # XSKY ships the MeshFusion management console; declaring this makes
  # the service form offer the management_url link field.
  management_url: true
  supported_modes: [managed]
  topology: per_node
  # The MP connector's zero-copy path is CUDA IPC: engines can only
  # attach the cache server on their own node.
  attach_locality: node_local
  # MeshFusion images are not published: every service names the image it
  # runs, so the catalog declares no release line and the form asks for an
  # image instead of a version. The launch arguments stay here — they are
  # the whole launch declaration such an entry has, and every image the
  # user names must be compatible with them.
  custom_version: true
  default_run_args: "--host {{host}} --port {{port}} --l1-size-gb {{ram_size}} --chunk-size {{chunk_size}} --http-host {{host}} --http-port {{metrics_port}} --eviction-policy {{eviction_policy}} --eviction-trigger-watermark {{eviction_trigger_watermark}} --eviction-ratio {{eviction_ratio}}"
  resource_profile:
    ram_gib: "{{ram_size}}"
    cpu: 2
  managed_fields:
    - name: eviction_policy
      label: { default: Eviction Policy, zh-CN: 淘汰策略 }
      default: LRU
      options: [LRU, IsolatedLRU, noop]
      description:
        default: >-
          LRU evicts least-recently-used chunks. IsolatedLRU keeps one LRU
          list per cache salt and requires per-salt quotas via the HTTP
          API. noop never evicts.
        zh-CN: >-
          LRU 淘汰最近最少使用的分块。IsolatedLRU 为每个 cache salt 维护独立的 LRU
          列表，并需通过 HTTP API 为每个 salt 设置配额。noop 从不淘汰。
    - name: eviction_trigger_watermark
      label: { default: Eviction Trigger Watermark, zh-CN: 淘汰触发水位 }
      type: number
      default: 0.85
      min: 0
      max: 1
      step: 0.05
      description:
        default: Memory usage fraction (0-1) that triggers eviction.
        zh-CN: 触发淘汰的内存使用率（0-1）。
    - name: eviction_ratio
      label: { default: Eviction Ratio, zh-CN: 淘汰比例 }
      type: number
      default: 0.1
      min: 0
      max: 1
      step: 0.05
      description:
        default: Fraction of memory (0-1) evicted per trigger.
        zh-CN: 每次触发所淘汰的内存比例（0-1）。
  l2_adapter_flag: "--l2-adapter"
  # The store is the only L2 tier MeshFusion is deployed with; a lone
  # declared backend is what the service form preselects.
  l2_backends:
    xdfs:
      display_name: XSKY MeshFusion Store
      icon: /static/catalog_icons/xsky.png
      # The UI exposes this as a separate switch above the fields. It defaults
      # to off because MeshFusion Store normally configures itself in the image.
      adapter_flag_optional: true
      adapter_flag_default: false
      adapter_flag_label:
        default: Enable L2 Adapter Flag
        zh-CN: 启用 L2 适配器参数
      description:
        default: >-
          XSKY MeshFusion Store distributed storage as the L2 tier; capacity
          and durability scale with the external storage cluster.
        zh-CN: >-
          企业级 KV Cache 扩展加速方案，激活 GPU 节点本地 DRAM 与 SSD 加速模型推理。基于端到端的
          NVMe 技术，提供跨节点共享、本地优先读写、自动淘汰策略、主动保护 SSD 寿命等多种能力。
      # The XDFS plugin is exposed through NIXL's dynamic store adapter. Its
      # plugin-specific values belong under backend_params and are strings,
      # including max_capacity_gb.
      adapter_type: nixl_store_dynamic
      adapter_backend: XDFS_KV
      adapter_params:
        conf: conf
        params_file: params_file
        tenant_id: tenant_id
        max_capacity_gb: max_capacity_gb
      fields:
        # The image supplies the plugin files and capacity defaults; tenant is
        # the only service-level override exposed by the form.
        - name: tenant_id
          label: { default: Tenant ID, zh-CN: 租户 ID }
          default: nixl
  common_parameters:
    - --l2-adapter
    # CLI-entry-only groups (coordinator / P2P), valid again now that the
    # run command uses `lmcache server` instead of the module entry.
    - --coordinator-url
    - --p2p-advertise-url
    - --max-workers
    - --max-gpu-workers
    - --max-cpu-workers
    - --hash-algorithm
    - --enable-segmented-prefix
    - --shm-name
    - --worker-reap-timeout-seconds
    - --worker-registration-grace-seconds
    - --l1-use-lazy
    - --l1-init-size-gb
    - --l1-align-bytes
    - --l1-read-ttl-seconds
    - --l1-write-ttl-seconds
    - --gds-l1-path
    - --gds-l1-use-direct-io
    - --l1-devdax-path
    - --l2-store-policy
    - --l2-prefetch-policy
    - --l2-prefetch-max-in-flight
    - --metrics-sample-rate
    - --disable-metrics
    - --disable-logging
    - --disable-observability
    - --enable-tracing
    - --otlp-endpoint
    - --event-bus-queue-size
    - --trace-level
    - --trace-output
  health_check:
    scheme: http
    path: /healthcheck
    target: metrics
  default_metrics:
    path: /metrics
    mappings:
      hit_rate:
        ratio:
          numerator: lmcache_mp_lookup_hit_tokens_total
          denominator: lmcache_mp_lookup_requested_tokens_total
      l1_usage_bytes:
        gauge: lmcache_mp_l1_memory_usage_bytes
      l1_usage_ratio:
        gauge: lmcache_mp_l1_usage_ratio
        aggregate: avg
      # One series per configured L2 adapter (l2_name label). Bytes
      # only: upstream exposes no L2 capacity gauge, so no ratio form.
      l2_usage_bytes:
        gauge: lmcache_mp_l2_usage_bytes
      # Lookup traffic gives the hit-rate chart its denominator context:
      # an empty hit-rate window reads as no traffic, not as a fault.
      lookup_tokens_per_second:
        rate: lmcache_mp_lookup_requested_tokens_total
    throughput:
      l0_l1_store: { histogram_avg: lmcache_mp_l0_l1_store_throughput_GB_per_second }
      l0_l1_load: { histogram_avg: lmcache_mp_l0_l1_load_throughput_GB_per_second }
      l2_store: { histogram_avg: lmcache_mp_l2_store_throughput_GB_per_second }
      l2_load: { histogram_avg: lmcache_mp_l2_load_throughput_GB_per_second }
  inference_backend_integrations:
    - backend: vLLM
      frameworks: [cuda]
      # Floor set by the newer of the two requirements: the MP connector
      # integration line validated in-house (v0.25.x) and the injected
      # --shutdown-timeout flag (vllm-project/vllm#36666, first released
      # in v0.25.0).
      versions: ">=0.25.0"
      injection:
        env:
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: auto }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_connector_module_path: lmcache.integration.vllm.lmcache_mp_connector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    # PLACEHOLDER. Change as needed.
    - backend: vLLM
      frameworks: [cann]
      versions: ">=0.25.0"
      injection:
        env:
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: engine_driven }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_connector_module_path: lmcache.integration.vllm.lmcache_mp_connector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    - backend: SGLang
      frameworks: [cuda]
      # LMCache MP support landed in sglang PR #24089 (merged 2026-05-28);
      # v0.5.13 is the first release carrying it.
      versions: ">=0.5.13"
      injection:
        env:
          PYTHONHASHSEED: "0"
        args:
          - "--enable-lmcache"
          - "--lmcache-config-file"
          - "/tmp/gpustack-lmcache-sgl.yaml"
        files:
          /tmp/gpustack-lmcache-sgl.yaml: |
            mp_host: "{{host}}"
            mp_port: {{port}}
