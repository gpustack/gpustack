# Builtin GPU instance templates for use.
#
# All images are mirrored into a single repository, quay.io/gpustack/instance,
# so that every builtin template resolves from one registry. Tags follow the
# gpustack/runner convention, backend first and vendor never shown:
#
#     <backend><version>[-<backend variant>]-<workload><version>
#
# for example cuda13.0-pytorch2.10, cann8.5.0-910b-ubuntu22.04. A template
# without an accelerator backend, i.e. the CPU ones, is tagged by its workload
# alone, for example ubuntu24.04.
#
# Each entry records the upstream reference it is mirrored from, so re-syncing
# stays reproducible.

items:

  #
  # CPU instance templates
  #

  ## Ubuntu
  - name: "ubuntu-24-04"
    displayName: "Ubuntu 24.04 LTS"
    manufacturer: "cpu"
    spec:
      # mirrored from docker.io/library/ubuntu:24.04
      image: "quay.io/gpustack/instance:ubuntu24.04"
      imagePullPolicy: "IfNotPresent"
      command:
        - "tail"
        - "-f"
        - "/dev/null"
      ports:
        - name: "SSH"
          port: 22
          protocol: "TCP"
      resources:
        localStorage: "15Gi"
      volumeMount: "/workspace"
  - name: "ubuntu-22-04"
    displayName: "Ubuntu 22.04 LTS"
    manufacturer: "cpu"
    spec:
      # mirrored from docker.io/library/ubuntu:22.04
      image: "quay.io/gpustack/instance:ubuntu22.04"
