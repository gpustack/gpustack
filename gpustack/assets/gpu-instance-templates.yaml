  ## Jupyter Lab
  - name: "jupyter-lab-4-5-cuda-12-8"
    displayName: "Jupyter Lab 4.5 + CUDA 12.8"
    manufacturer: "nvidia"
    spec:
      # mirrored from quay.io/jupyter/pytorch-notebook:cuda12-lab-4.5.7
      image: "quay.io/gpustack/instance:cuda12.8-jupyterlab4.5.7"
      imagePullPolicy: "IfNotPresent"
      command:
        - "jupyter"
        - "lab"
        - "--ServerApp.token={{generated_token}}"
        - "--notebook-dir=/workspace"
        - "--allow-root"
      ports:
        - name: "JUPYTER"
          port: 8888
          protocol: "TCP"
          accessParams:
            token: "{{generated_token}}"
      resources:
        localStorage: "15Gi"
      volumeMount: "/workspace"
