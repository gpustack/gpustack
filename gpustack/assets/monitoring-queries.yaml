# Native detail monitoring queries. This file is read by the Server.
# Engine-version normalization remains in metrics_config/metrics_config.yaml.
# Read charts -> metrics/hardware_metrics -> query_profile -> expressions.
# ${selector}, grouping and source labels come from authorized server scope.
# sum/count/buckets below are guarded and aggregated before final statistics.
# Frontend layout/localized titles stay in the UI; derived_in_ui is descriptive,
# never evaluated as code. API metric keys and response fields remain unchanged.
# Chart descriptions are English developer metadata, not localized UI titles.
schema_version: 1

time_windows:
  llm:
    target_points: 120
    min_step_seconds: 15
    rate_window_extra_seconds: 60
  hardware:
    target_points: 240
    min_step_seconds: 15
    freshness_seconds: 120
  # Engine and hardware share the benchmark evaluation grid. This does not
  # shorten the LLM rolling rate window or create additional scrape samples.
  benchmark:
    target_points: 120
    min_step_seconds: 1

# Common scaffolding always applies; metric declarations cannot disable guards.
expressions:
  # Benchmark phases only admit normalized gauge samples stored in their interval.
  sample_since: (${expression}) and (timestamp(${selector}) >= ${start})
  engine_success: gpustack:runtime_metrics_scrape_status${selector}
  engine_inventory: gpustack:model_instance_source_info${selector}
  history_presence: max_over_time(${expression}[${window_seconds}s])
  engine_guard: >-
    (max without (${plumbing_labels}) (${expression})
    == min without (${plumbing_labels}) (${expression})) and on (${source_labels})
    (max by (${source_labels}) (${success} == 1)) and on (${source_labels})
    (max by (${source_labels}) (${inventory} == 1))
  aggregate: ${operation} by (${grouping}) (${expression})
  divide: (${numerator}) / (${denominator})
  pair: (${left}) and (${right})
  compare_population: (${paired}) == (${population})
  match_group: (${expression}) and on (${grouping}) (${condition})

# The actual PromQL lives here. Profiles can be shared or specialized per metric.
# Trend uses the short rate window; increase uses the full selected range.
profiles:
  gauge:
    kind: gauge
    expressions:
      sample: ${family}${selector}
  scheduler_queue_total:
    kind: gauge
    # SGLang emits a total and optional per-priority breakdowns. An empty
    # matcher selects the total and also matches exporters without this label.
    sample_labels:
      priority: ''
    expressions:
      sample: ${family}${selector}
  counter:
    kind: counter
    expressions:
      rate: rate(${family}${selector}[${window_seconds}s])
      increase: increase(${family}${selector}[${window_seconds}s])
      window_rate: (${expression}) / ${window_seconds}
  histogram:
    kind: histogram
    expressions:
      rate: rate(${family}_${part}${selector}[${window_seconds}s])
      increase: increase(${family}_${part}${selector}[${window_seconds}s])
      avg: (${sum}) / (${count})
      p50: histogram_quantile(0.5, ${buckets})
      p95: histogram_quantile(0.95, ${buckets})
      p99: histogram_quantile(0.99, ${buckets})
      positive_count: (${expression}) > 0
      observed_buckets: (${buckets}) and ignoring (le) (${count})
      trend_component: >-
        label_replace((${expression}), "histogram_component", "${part}", "__name__", ".*")
      bucket_population: (max without (le) (${expression})) unless ((${count}) == 0)
      canonical_bucket: >-
        (max without (le) (${expression})) ==
        (min without (le) (${expression}))
      paired_buckets: >-
        (((${finite}) >= 0) <= (${count})) and ((${infinite}) == (${count}))
      cdf: >-
        label_replace(
          ((sum by (${grouping}) (${paired})) /
          (sum by (${grouping}) (${count}))) and on (${grouping})
          ((count by (${grouping}) (${paired})) ==
          (count by (${grouping}) (${finite_population}))) and on (${grouping})
          ((count by (${grouping}) (${paired})) ==
          (count by (${grouping}) (${count}))) and on (${grouping})
          ((count by (${grouping}) (${paired})) ==
          (count by (${grouping}) (${infinite_population}))),
          "histogram_upper_bound", "${upper_bound}", "__name__", ".*")
  hardware_gauge:
    kind: gauge
    scope: hardware
    expressions:
      sample: >-
        (${selector}) and (time() - timestamp(${selector}) <= ${freshness_seconds})
  gateway_average:
    kind: histogram
    scope: gateway
    # Higress exposes cumulative milliseconds and request counts, not buckets.
    # Sum paired cohorts before division; only Avg is supported.
    expressions:
      rate: rate(${family}${selector}[${window_seconds}s])
      increase: increase(${family}${selector}[${window_seconds}s])

# Keys are existing API metric keys. Backend overrides select semantic kind,
# not native exporter-version names (those belong to Worker normalization).
metrics:
  ttft:
    family: gpustack:time_to_first_token_seconds
    kind: histogram
    unit: seconds
    measurement_scope: engine_local
    query_profile: histogram
    section: llm
  tpot:
    family: gpustack:time_per_output_token_seconds
    kind: histogram
    unit: seconds
    measurement_scope: engine_local
    query_profile: histogram
    section: llm
  itl:
    family: gpustack:inter_token_latency_seconds
    kind: histogram
    unit: seconds
    measurement_scope: engine_local
    query_profile: histogram
    section: llm
  e2e:
    family: gpustack:e2e_request_latency_seconds
    kind: histogram
    unit: seconds
    measurement_scope: engine_local
    query_profile: histogram
    section: llm
  queue:
    family: gpustack:request_queue_time_seconds
    kind: histogram
    unit: seconds
    measurement_scope: engine_local
    query_profile: histogram
    section: llm
  prefill:
    family: gpustack:request_prefill_time_seconds
    kind: histogram
    unit: seconds
    measurement_scope: engine_local
    query_profile: histogram
    section: llm
  decode:
    family: gpustack:request_decode_time_seconds
    kind: histogram
    unit: seconds
    measurement_scope: engine_local
    query_profile: histogram
    section: llm
  input_tokens:
    family: gpustack:prompt_tokens_total
    kind: counter
    unit: tokens_per_second
    measurement_scope: engine_processed_tokens
    query_profile: counter
    section: llm
  output_tokens:
    family: gpustack:generation_tokens_total
    kind: counter
    unit: tokens_per_second
    measurement_scope: engine_processed_tokens
    query_profile: counter
    section: llm
  running_requests:
    family: gpustack:num_requests_running
    kind: gauge
    unit: requests
    measurement_scope: engine_local_requests
    query_profile: gauge
    section: llm
    backend_overrides:
      sglang:
        query_profile: scheduler_queue_total
  waiting_requests:
    family: gpustack:num_requests_waiting
    kind: gauge
    unit: requests
    measurement_scope: engine_local_requests
    query_profile: gauge
    section: llm
    backend_overrides:
      sglang:
        query_profile: scheduler_queue_total
  kv_usage:
    family: gpustack:kv_cache_usage_ratio
    kind: gauge
    unit: percent
    measurement_scope: engine_kv_pool
    scale: 100
    per_source: true
    query_profile: gauge
    section: llm
  prefix_cache_hit_rate:
    family: gpustack:prefix_cache_hits_total
    kind: counter
    unit: percent
    measurement_scope: engine_cache_lookup_ratio
    denominator: gpustack:prefix_cache_queries_total
    scale: 100
    query_profile: counter
    section: llm
    backend_overrides:
      sglang:
        family: gpustack:prefix_cache_hit_rate
        kind: gauge
        measurement_scope: reported_source_cache_ratio
        denominator: null
        per_source: true
        query_profile: gauge
      mindie:
        family: gpustack:prefix_cache_hit_rate
        kind: gauge
        measurement_scope: reported_source_cache_ratio
        denominator: null
        per_source: true
        query_profile: gauge
  external_cache_hit_rate:
    family: gpustack:external_prefix_cache_hits_total
    kind: counter
    unit: percent
    measurement_scope: engine_external_cache_lookup_ratio
    denominator: gpustack:external_prefix_cache_queries_total
    scale: 100
    query_profile: counter
    section: llm
  pd_kv_transfer:
    family: gpustack:pd_kv_transfer_seconds
    kind: histogram
    unit: seconds
    measurement_scope: kv_transfer_duration
    query_profile: histogram
    section: pd
    backend_overrides:
      sglang:
        measurement_scope: bootstrap_handshake
  # Completion is separate from the legacy connector/handshake observation.
  # SGLang only records the sender histogram when its connector reports bytes.
  pd_kv_completion:
    family: gpustack:pd_kv_transfer_seconds
    kind: histogram
    unit: seconds
    measurement_scope: kv_transfer_duration
    query_profile: histogram
    section: pd
    backend_overrides:
      sglang:
        family: gpustack:pd_kv_transfer_latency_seconds
  pd_kv_throughput:
    family: gpustack:pd_kv_transfer_bytes_sum
    kind: counter
    unit: bytes_per_second
    measurement_scope: connector_bytes_per_wall_second
    query_profile: counter
    section: pd
  pd_kv_transfer_failures:
    family: gpustack:pd_kv_transfer_failed_total
    kind: counter
    unit: events_per_second
    measurement_scope: connector_transfer_failures
    query_profile: counter
    section: pd
  pd_kv_bootstrap_failures:
    family: gpustack:pd_bootstrap_failed_total
    kind: counter
    unit: events_per_second
    measurement_scope: connector_bootstrap_failures
    query_profile: counter
    section: pd
  pd_kv_expired:
    family: gpustack:pd_kv_lease_expired_total
    kind: counter
    unit: events_per_second
    measurement_scope: connector_kv_expiry
    query_profile: counter
    section: pd
  router_health:
    family: gpustack:pd_router_worker_health
    kind: gauge
    unit: state
    measurement_scope: router_upstream_health
    query_profile: gauge
    section: pd
  # Native gateway observations are independent of role-local engine timers.
  # Streaming TTFT and all-request service latency have different counts.
  ingress_ttft:
    family: route_upstream_model_consumer_metric_llm_first_token_duration
    denominator: route_upstream_model_consumer_metric_llm_stream_duration_count
    kind: histogram
    unit: seconds
    measurement_scope: service_ingress
    query_profile: gateway_average
    scale: 0.001
    section: pd
  ingress_e2e:
    family: route_upstream_model_consumer_metric_llm_service_duration
    denominator: route_upstream_model_consumer_metric_llm_duration_count
    kind: histogram
    unit: seconds
    measurement_scope: service_ingress
    query_profile: gateway_average
    scale: 0.001
    section: pd
  pd_kv_transfer_post:
    family: gpustack:pd_kv_transfer_post_seconds
    kind: histogram
    unit: seconds
    measurement_scope: transfer_submission_duration
    query_profile: histogram
    section: pd
  pd_kv_allocation:
    family: gpustack:pd_kv_transfer_alloc_seconds
    kind: histogram
    unit: seconds
    measurement_scope: receive_allocation_duration
    query_profile: histogram
    section: pd
  pd_kv_transfer_bytes:
    family: gpustack:pd_kv_transfer_bytes
    kind: histogram
    unit: bytes
    measurement_scope: connector_reported_transfer_size
    query_profile: histogram
    section: pd
  pd_kv_transfer_speed:
    family: gpustack:pd_kv_transfer_bandwidth_bytes_per_second
    kind: histogram
    unit: bytes_per_second
    measurement_scope: connector_reported_transfer_speed
    query_profile: histogram
    section: pd
  pd_prefill_bootstrap_queue:
    family: gpustack:pd_prefill_bootstrap_queue_requests
    kind: gauge
    unit: requests
    measurement_scope: prefill_bootstrap_queue
    query_profile: scheduler_queue_total
    section: pd
  pd_prefill_inflight_queue:
    family: gpustack:pd_prefill_inflight_queue_requests
    kind: gauge
    unit: requests
    measurement_scope: prefill_inflight_queue
    query_profile: scheduler_queue_total
    section: pd
  pd_decode_prealloc_queue:
    family: gpustack:pd_decode_prealloc_queue_requests
    kind: gauge
    unit: requests
    measurement_scope: decode_preallocation_queue
    query_profile: scheduler_queue_total
    section: pd
  pd_decode_transfer_queue:
    family: gpustack:pd_decode_transfer_queue_requests
    kind: gauge
    unit: requests
    measurement_scope: decode_transfer_queue
    query_profile: scheduler_queue_total
    section: pd
  router_requests:
    family: gpustack:pd_router_requests_total
    kind: counter
    unit: requests_per_second
    measurement_scope: router_received_requests
    query_profile: counter
    section: pd
  router_request_duration:
    family: gpustack:pd_router_request_duration_seconds
    kind: histogram
    unit: seconds
    measurement_scope: router_observed_request
    query_profile: histogram
    section: pd
hardware_metrics:
  gpu_utilization:
    family: worker_gpu_utilization_percent
    kind: gauge
    unit: percent
    query_profile: hardware_gauge
    minimum: 0
    maximum: 100
  gpu_memory_used:
    family: worker_gpu_memory_used_bytes
    kind: gauge
    unit: bytes
    query_profile: hardware_gauge
    minimum: 0
    maximum: null
  gpu_memory_total:
    family: worker_gpu_memory_total_bytes
    kind: gauge
    unit: bytes
    query_profile: hardware_gauge
    minimum: 0
    maximum: null
  gpu_power:
    family: worker_gpu_power_watts
    kind: gauge
    unit: watts
    query_profile: hardware_gauge
    minimum: 0
    maximum: null
  gpu_temperature:
    family: worker_gpu_temperature_celsius
    kind: gauge
    unit: celsius
    query_profile: hardware_gauge
    minimum: null
    maximum: null
  host_cpu:
    family: worker_host_cpu_utilization_percent
    kind: gauge
    unit: percent
    query_profile: hardware_gauge
    minimum: 0
    maximum: 100
  host_memory_used:
    family: worker_host_memory_used_bytes
    kind: gauge
    unit: bytes
    query_profile: hardware_gauge
    minimum: 0
    maximum: null
  host_memory_total:
    family: worker_host_memory_total_bytes
    kind: gauge
    unit: bytes
    query_profile: hardware_gauge
    minimum: 0
    maximum: null
  filesystem_usage:
    family: worker_filesystem_utilization_percent
    kind: gauge
    unit: percent
    query_profile: hardware_gauge
    minimum: 0
    maximum: 100
    model_resource: false
charts:
  model.pd_ingress:
    description: Service-ingress experience, unavailable until collected
    metrics:
    - ingress_ttft
    - ingress_e2e
    apis:
    - model_runtime
  model.pd_handoff:
    description: Transfer completion, wall-time byte throughput and independent failure/expiry events
    metrics:
    - pd_kv_completion
    - pd_kv_throughput
    - pd_kv_transfer_failures
    - pd_kv_bootstrap_failures
    - pd_kv_expired
    apis:
    - model_runtime
  model.pd_queues:
    description: Separate scheduler handoff queues on their native Prefill or Decode role
    metrics:
    - pd_prefill_bootstrap_queue
    - pd_prefill_inflight_queue
    - pd_decode_prealloc_queue
    - pd_decode_transfer_queue
    apis:
    - model_runtime
  model.pd_router:
    description: Router received requests and router-observed forwarding request duration
    metrics:
    - router_requests
    - router_request_duration
    - router_health
    apis:
    - model_runtime
  model.ttft:
    description: Time to first token (TTFT)
    metrics:
    - ttft
    apis:
    - model_runtime
  model.generation:
    description: Time per output token (TPOT) and inter-token latency (ITL)
    metrics:
    - tpot
    - itl
    apis:
    - model_runtime
  model.tokens:
    description: Token throughput
    metrics:
    - input_tokens
    - output_tokens
    apis:
    - model_runtime
    derived_in_ui: Total = input + output; missing data stays null. PD input uses Prefill and output uses Decode;
      instance view compares output.
  model.requests:
    description: Running and waiting requests
    metrics:
    - running_requests
    - waiting_requests
    apis:
    - model_runtime
  model.request_latency:
    description: Request and phase latency
    metrics:
    - e2e
    - queue
    - prefill
    - decode
    apis:
    - model_runtime
  model.engine_cache:
    description: Engine cache
    metrics:
    - kv_usage
    - prefix_cache_hit_rate
    - external_cache_hit_rate
    apis:
    - model_runtime
  model.pd_transfer:
    description: Prefill-decode KV transfer
    metrics:
    - pd_kv_transfer
    apis:
    - model_runtime
  model.router_health:
    description: Prefill-decode router health
    metrics:
    - router_health
    apis:
    - model_runtime
  gpu.utilization:
    description: GPU utilization
    metrics:
    - gpu_utilization
    apis:
    - model_resource
    - worker_resource
    - gpu_resource
  gpu.memory:
    description: GPU memory usage and utilization
    metrics:
    - gpu_memory_used
    - gpu_memory_total
    apis:
    - model_resource
    - worker_resource
    - gpu_resource
    derived_in_ui: Usage percent = used / total * 100, paired by device and timestamp. Device pages retain separate
      Used/Total series.
  gpu.power:
    description: GPU power
    metrics:
    - gpu_power
    apis:
    - model_resource
    - worker_resource
    - gpu_resource
  gpu.temperature:
    description: GPU temperature
    metrics:
    - gpu_temperature
    apis:
    - model_resource
    - worker_resource
    - gpu_resource
  worker.cpu:
    description: Host CPU utilization
    metrics:
    - host_cpu
    apis:
    - model_resource
    - worker_resource
  worker.memory:
    description: Host memory
    metrics:
    - host_memory_used
    - host_memory_total
    apis:
    - model_resource
    - worker_resource
  worker.filesystem:
    description: Filesystem capacity utilization
    metrics:
    - filesystem_usage
    apis:
    - worker_resource
