# Default values for gpustack.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
debug: false
# registrationToken is used to authenticate workers with the server.
# If null, a random 32-character token is generated on first install and reused on upgrades.
registrationToken: null
# Name of an existing Secret carrying `GPUSTACK_TOKEN`. When set, the chart
# references it and creates nothing — `registrationToken` above is then unused
# and the Secret's lifecycle belongs to whoever created it.
#
# Two cases need this:
#   - server and workers installed as two releases in the same namespace. The
#     Secret name is not release-prefixed, so both releases would render the same
#     object and the second install would be refused for not owning it. Point the
#     second release at the first one's Secret.
#   - a registration flow that creates the Secret out-of-band (e.g. `kubectl
#     apply` of a manifest) and then hands the rest of the install to Helm.
#
# Left empty, the chart creates and references `registration-token` as before.
registrationTokenSecretName: ""
# Opaque marker recorded into a ConfigMap as part of the release, for a caller
# that installs this chart from an automated flow and wants to know which
# configuration the cluster is actually running. The registration manifest sets
# it to a digest of what it asked for, and its bootstrap Job skips a `helm
# upgrade` when the two agree — which keeps `helm history` from filling with
# no-op revisions. Nothing in this chart reads it; left empty, no object is
# rendered for it.
appliedRevision: ""
# Global values are propagated to all sub-charts (Helm convention).
# `global.hub` is the container registry host (e.g. docker.io).
# For air-gapped or private registry installs, override:
#   --set global.hub=myregistry.example.com
#
# `global.imagePullSecrets` is the list of Secret references attached to every
# pod created by this chart and propagated to sub-charts (higress-core,
# gpustack-enterprise) that follow the same convention. Defaults to a single
# entry pointing at the canonical `gpustack-image-pull-secret` that this chart
# auto-creates (see `imagePullSecret` below).
#
# To reference your own pre-existing Secrets, replace the list entirely:
#   global:
#     imagePullSecrets:
#       - name: my-existing-secret
#       - name: another-secret
# When the list no longer references `gpustack-image-pull-secret` and no
# credentials are provided below, the chart skips creating the canonical
# Secret to avoid leaving an unused resource behind.
global:
  hub: docker.io
  imagePullSecrets:
    - name: gpustack-image-pull-secret
  # Default nodeSelector applied to every GPUStack component (server + worker)
  # when no component-level nodeSelector is provided. Component-level
  # `server.nodeSelector` / `worker.nodeSelector`, when non-empty, REPLACE
  # this value entirely (no merging).
  nodeSelector: {}

# Auto-creation of the canonical `gpustack-image-pull-secret` docker-registry
# Secret. The Secret is created when either:
#   - `credentials.username` and `credentials.password` are set (populated
#     `.dockerconfigjson`), or
#   - `global.imagePullSecrets` above still references the canonical name
#     (created with an empty `{"auths":{}}` — harmless to reference, useful as
#     a placeholder when no credentials are needed).
# If the user fully swaps `global.imagePullSecrets` to externally managed
# Secrets AND provides no credentials here, the canonical Secret is not
# created.
imagePullSecret:
  # Set false to reference the canonical Secret without creating it, for a
  # second release in a namespace whose sibling release already owns it — two
  # releases rendering the same Secret makes the second install fail on an
  # object it does not own. The name is not release-scoped because sub-charts
  # reach it only through `global.imagePullSecrets`, a literal in this file that
  # cannot carry the release name. Installing the two releases into separate
  # namespaces avoids the collision without this switch.
  create: true
  credentials:
    registry: docker.io
    username: null
    password: null
    email: null
image:
  # Image repository including namespace (no registry). The final reference is
  # rendered as `{global.hub}/{image.repository}:{image.tag}`.
  repository: gpustack/gpustack
  tag: null
  pullPolicy: IfNotPresent
server:
  # Deploy the GPUStack server (control plane) from this release.
  #
  # Set to false for a worker-only install: the workers register with an
  # existing server elsewhere, addressed by `worker.serverURL`. In that mode
  # `registrationToken` becomes required — the token belongs to the server that
  # owns the cluster, so it can never be generated locally.
  #
  # A worker-only install also has no use for the gateway, which lives with the
  # server. Helm cannot derive a sub-chart condition from another value, so turn
  # the Higress sub-chart off explicitly alongside it:
  #   --set server.enabled=false --set higress-core.enabled=false
  enabled: true
  ingress:
    # example: gpustack.example.com
    hostname: null
    tls:
      # if tls.cert and tls.key are set, the schema will be https
      cert: null
      # cert: |-
      #   -----BEGIN CERTIFICATE-----
      #   MIID...
      #   -----END CERTIFICATE-----
      key: null
      # key: |-
      #   -----BEGIN PRIVATE KEY-----
      #   MIIE...
      #   -----END PRIVATE KEY-----

  # if you have an existing database, set externalDatabaseURL to its connection string
  # e.g. postgresql://user:password@hostname:port/dbname
  externalDatabaseURL: null
  dataVolume:
    hostPath: null
    size: 100Gi
  apiPort: 30080
  metricsPort: 10161
  # Shared initial admin password across server replicas. Creates a Secret so
  # every replica bootstraps the same admin password behind the load balancer.
  # Only needed for multi-replica (HA) setups; single-node installs generate a
  # per-node password without it. Enterprise enables this by default.
  bootstrapPasswordSecret:
    enabled: false
    # Pin a known initial password. When set, it is injected into every replica
    # as GPUSTACK_BOOTSTRAP_PASSWORD and treated as operator-chosen: no forced
    # first-login change and no password-retrieval guide (same behavior as
    # --bootstrap-password on CLI/Docker).
    #
    # Leave null to auto-generate a random password instead. The random value is
    # mounted as a shared file on every replica so all of them show the same
    # first-login retrieval guide, and forces a first-login change.
    #
    # GitOps note (auto-generated case only): the random value is kept stable
    # across upgrades via Helm's `lookup`, which cannot read the cluster during
    # template rendering (ArgoCD/Flux, `helm template`). In those environments a
    # new random value is produced on every sync; set a static `password` here
    # to pin it.
    password: null
  environmentConfig: {}
  # Extra volume mounts for the server container. Use together with
  # `extraVolumes` to mount additional files into the server pod, e.g. a
  # private/self-signed CA into /usr/local/share/ca-certificates/ so that
  # gpustack-prerun.sh merges it into the OS CA bundle at startup.
  extraVolumeMounts: []
  # - name: private-ca
  #   mountPath: /usr/local/share/ca-certificates/my-ca.crt
  #   subPath: my-ca.crt
  #   readOnly: true
  extraVolumes: []
  # - name: private-ca
  #   configMap:
  #     name: private-ca
  # Node selector for the server pod. When non-empty, REPLACES
  # `global.nodeSelector` entirely (no merging). Leave empty/null to fall
  # back to `global.nodeSelector`.
  nodeSelector: {}
  # Affinity for the server pod. When non-empty, REPLACES the built-in default
  # entirely (no merging). Leave empty/null to use the default: when
  # `replicas > 1`, a hard (required) podAntiAffinity by `kubernetes.io/hostname`
  # spreads replicas across nodes so a single node failure only takes down one
  # replica. NOTE: the hard rule requires at least as many schedulable nodes as
  # replicas, otherwise extra replicas stay Pending; override this knob (e.g.
  # with a `preferred` rule) for smaller clusters.
  affinity: {}
  # Server pod probes. Each is rendered verbatim when non-empty; set to null/{}
  # to disable a probe. The server only starts serving HTTP after DB migrations
  # and init complete, so the startupProbe (up to ~300s here) guards the
  # slow-start window before livenessProbe takes over — increase its
  # `failureThreshold` for slow/remote databases. Ports refer to the container's
  # named `http` port.
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 5
    successThreshold: 1
clusterDomain: cluster.local
gateway:
  # IngressClass name for the Higress gateway; GPUStack checks if it exists in the cluster to enable in-cluster gateway mode
  ingressClassname: higress

# higress-core sub-chart configuration.
# Set enabled: true to deploy Higress gateway alongside GPUStack.
# If you already have Higress installed in the cluster, leave this disabled
# and ensure gateway.ingressClassname matches your existing Higress instance.
# Full list of available values: https://higress.io/helm-charts
higress-core:
  enabled: true
  global:
    # Must match gateway.ingressClassname above
    ingressClass: higress
    # GPUStack manages its own plugin server; disable the built-in one
    enablePluginServer: false
    # `hub` is inherited from the top-level `global.hub` via Helm's
    # global-values propagation. Override here only when higress images
    # live in a different registry than the rest of GPUStack.
  downstream:
    idleTimeout: 1800
  upstream:
    idleTimeout: 3
  gateway:
    # Empty string (not null): a literal `null` in a values file no longer
    # overrides the subchart's default under Helm v4's coalesce semantics
    # (only `--set ...=null` deletes). "" reliably falls through to
    # `.Values.global.hub` on both Helm v3 and v4.
    hub: ""
    image: gpustack/mirrored-higress-gateway
    imagePullSecrets:
      - name: gpustack-image-pull-secret

    service:
      # Preserve real client IP at the gateway (required for IP-based
      # rate limiting, audit logging, and X-Forwarded-For correctness).
      # Note: when Service type is LoadBalancer/NodePort, ensure the
      # external LB performs health checks against healthCheckNodePort,
      # otherwise nodes without a gateway pod will drop traffic.
      externalTrafficPolicy: Local
  controller:
    hub: ""
    image: gpustack/mirrored-higress-higress
    imagePullSecrets:
      - name: gpustack-image-pull-secret
  pilot:
    hub: ""
    image: gpustack/mirrored-higress-pilot
higressPlugins:
  # Number of higress-plugins deployment replicas.
  replicas: 1
  image:
    # Image repository including namespace (no registry); final reference is `{global.hub}/{repository}:{tag}`.
    repository: gpustack/higress-plugins
    pullPolicy: IfNotPresent
    tag: "0.2.3.post5"
worker:
  enabled: false
  # Address of the GPUStack server the workers register with, e.g.
  # `http://gpustack.example.com:30080`.
  #
  # Leave empty to address the server deployed by this release over its
  # in-cluster Service. Required when `server.enabled` is false, where there is
  # no such Service to point at.
  serverURL: ""
  # GPU vendors for the worker nodes. Accepts a list to allow a single
  # cluster to schedule workers for multiple runtimes side-by-side.
  # Controls per-DaemonSet driver volume mounts and runtimeClassName.
  # Supported values (per entry):
  #   nvidia    - NVIDIA GPU; sets runtimeClassName to "nvidia"
  #   mthreads  - Moore Threads GPU; sets runtimeClassName to "mthreads"
  #   amd       - AMD GPU (ROCm); mounts /opt/rocm and /opt/rocm/lib
  #   ascend    - Huawei Ascend NPU; mounts /usr/local/Ascend/driver and /usr/local/Ascend/ascend-toolkit
  #   hygon     - Hygon DCU; mounts /opt/hyhal, /opt/dtk and /etc/dmi_mig_config
  #   metax     - MetaX GPU; mounts /opt/mxdriver and /opt/maca
  #   iluvatar  - Iluvatar GPU; mounts /usr/local/corex
  #   cambricon - Cambricon MLU; mounts /usr/bin/cnmon and /usr/local/neuware
  #   thead     - T-Head PPU; mounts /usr/local/PPU_SDK
  #
  # A CPU worker DaemonSet (`<release>-worker`) is always rendered and uses
  # the nodeSelector `feature.gpustack.ai/acceleratable: "false"` to schedule
  # onto non-acceleratable (CPU-only) nodes. It has no vendor-specific volume
  # mounts or runtimeClassName.
  #
  # Rendering modes:
  #   - [] (empty): only the CPU DaemonSet `<release>-worker` is rendered
  #     (single mode — no vendor labels, no anti-affinity).
  #   - 1+ entries: CPU DaemonSet `<release>-worker` plus one DaemonSet per
  #     GPU vendor named `<release>-worker-<vendor>` (multi-vendor mode).
  #     All worker pods get a required podAntiAffinity
  #     (topologyKey=hostname, namespaceSelector={}) so two GPUStack worker
  #     pods cannot share a node even across namespaces — protects the
  #     `hostNetwork: true` ports from collision.
  #
  # Each GPU DaemonSet automatically receives a PCI-presence nodeSelector label
  # (e.g. `feature.node.kubernetes.io/pci-10de.present: "true"` for NVIDIA)
  # based on the vendor's PCI ID. These labels are advertised by Node Feature
  # Discovery (NFD); NFD must be installed in the cluster for GPU workers to
  # schedule onto GPU nodes.
  gpuVendors:
    - nvidia
  # Base nodeSelector for ALL worker DaemonSets. When non-empty, REPLACES
  # `global.nodeSelector` entirely (no merging with global). Leave empty
  # to fall back to `global.nodeSelector`. Each DaemonSet additionally
  # receives its vendor PCI-presence label merged on top (PCI label wins
  # on conflict).
  nodeSelector: {}
  port: 10150
  metricsPort: 10151
  environmentConfig: {}
  # Host path for worker data directory.
  dataDir: /var/lib/gpustack
  extraVolumeMounts: []
  # - name: custom-lib
  #   mountPath: /opt/custom/lib
  #   readOnly: true
  extraVolumes: []
  # - name: custom-lib
  #   hostPath:
  #     path: /opt/custom/lib
  #     type: DirectoryOrCreate
# gpustack-operator sub-chart. The operator manages worker workload lifecycle
# and derives the Kueue scheduling chain from node hardware; it is deployed
# whenever `worker.enabled` is true (the sub-chart's `condition` in Chart.yaml).
#
# The keys below are the sub-chart's own, passed through verbatim — see
# https://github.com/gpustack/gpustack-operator/blob/main/deploy/gpustack-operator/chart/values.yaml
# for the full list. Nothing is mirrored into a GPUStack-shaped schema on
# purpose: a re-invented surface would have to be kept in lockstep with theirs
# through every upgrade, and nothing would check that it was.
#
# Notable defaults that come from the sub-chart and are relied on here:
#   - `image.tag` defaults to `v<appVersion>`, and its appVersion is kept equal
#     to its chart version, so pinning the dependency version in Chart.yaml
#     pins the operator image too. Nothing needs to state the tag.
#   - `worker.disableApplications: ["*"]` — this chart deploys Kueue / NFD / the
#     CSI drivers as the operator chart's own sub-charts, so the operator must
#     not also install them at runtime. Do not narrow this: anything left off
#     the list makes the operator install a SECOND release of the same chart,
#     which fails on objects this release already owns.
#   - `global.certmanager.enabled: auto` — cert-manager resources are created
#     only when its CRDs are detected in the cluster.
#
# Turning an individual component off (e.g. a cluster that already runs Kueue):
#   --set gpustack-operator.kueue.enabled=false
gpustack-operator:
  # Without this the sub-chart names itself `<release>-gpustack-operator`, which
  # stutters for the usual `gpustack` release name. `operator` yields
  # `gpustack-operator-*` — still release-prefixed, so two releases can coexist
  # in one namespace, and identical to the names the pre-chart registration
  # manifest used, which lets an existing install be adopted rather than
  # replaced.
  nameOverride: operator
  worker:
    # 'Recreate', not the chart-default rolling update: the operator fronts an
    # aggregated API whose APIService is a cluster singleton, so two replicas
    # answering during a rollout fight over it and serve mixed versions. Pausing
    # the API through the upgrade is the lesser evil.
    strategyType: Recreate
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: 500m
        memory: 512Mi
